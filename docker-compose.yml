services:
  nekobt_notification:
    build: .
    image: nekobt_notification:latest
    container_name: nekobt_notification
    volumes:
      - ./config.json:/app/config.json
      - ./cache.json:/app/cache.json
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
